# Publie le site sur GitHub Pages à chaque push sur main
# (workflow officiel GitHub pour un site statique).
# Prérequis : Settings → Pages → Source = "GitHub Actions".
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  # Permet de relancer la publication à la main depuis l'onglet Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; on n'interrompt pas celle en cours
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4
      - name: Configuration de Pages
        uses: actions/configure-pages@v5
      - name: Envoi des fichiers du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Publication sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
