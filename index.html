<!DOCTYPE html>
<html lang="fr">
<head>
  <!-- =========================================================
       MÉTADONNÉES
       ========================================================= -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Claudio Marcelly BAKA | Liens</title>
  <meta name="description" content="Claudio Marcelly BAKA — Passionné de dropshipping. Retrouvez tous mes liens ici." />
  <meta name="theme-color" content="#0b0b14" />
  <meta name="color-scheme" content="dark" />

  <!-- Aperçu lors du partage sur les réseaux (Open Graph) -->
  <meta property="og:type" content="profile" />
  <meta property="og:title" content="Claudio Marcelly BAKA" />
  <meta property="og:description" content="Passionné de dropshipping. Retrouvez tous mes liens ici." />
  <meta property="og:image" content="https://ui-avatars.com/api/?name=Claudio+Baka&size=512&background=7c3aed&color=ffffff&bold=true" />

  <!-- Favicon en SVG inline (pas de fichier séparé) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c3aed'/%3E%3Cstop offset='1' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='32' fill='url(%23g)'/%3E%3Ctext x='32' y='41' font-family='Arial' font-weight='700' font-size='26' fill='white' text-anchor='middle'%3ECB%3C/text%3E%3C/svg%3E" />

  <!-- =========================================================
       POLICES : Poppins (titres) + Inter (texte)
       ========================================================= -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />

  <!-- =========================================================
       ICÔNES : Font Awesome 6 (CDN cdnjs, intégrité vérifiée)
       ========================================================= -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

  <style>
    /* =========================================================
       1. VARIABLES (couleurs, rayons, timings)
       Modifier ici pour changer tout le thème d'un coup.
       ========================================================= */
    :root {
      --bg: #0b0b14;                          /* fond de base */
      --text: #f5f5f7;                        /* texte principal */
      --text-muted: rgba(245, 245, 247, 0.72);/* texte secondaire (contraste > 4.5:1) */

      --violet: #7c3aed;
      --cyan:   #06b6d4;
      --pink:   #db2777;

      /* Verre (glassmorphism) */
      --glass-bg:            rgba(255, 255, 255, 0.06);
      --glass-bg-hover:      rgba(255, 255, 255, 0.10);
      --glass-border:        rgba(255, 255, 255, 0.14);
      --glass-border-hover:  rgba(255, 255, 255, 0.32);
      --glass-blur:          16px;

      --radius: 16px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1); /* courbe douce "ease-out-quint" */
      --speed: 280ms;

      --font-title: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-body:  "Inter",   system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    /* =========================================================
       2. RESET MINIMAL
       ========================================================= */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      min-height: 100vh;
      min-height: 100dvh;               /* hauteur réelle sur mobile (barre d'adresse) */
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 16px;                  /* 16px min : lisible et pas de zoom auto sur iOS */
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;               /* aucun scroll horizontal */
    }

    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    /* =========================================================
       3. FOND ANIMÉ (dégradé dynamique)
       Trois "halos" colorés qui dérivent lentement.
       On anime uniquement "transform" : fluide, géré par le GPU.
       ========================================================= */
    .background {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      background:
        radial-gradient(ellipse at top, #1a1033 0%, transparent 60%),
        radial-gradient(ellipse at bottom, #071a24 0%, transparent 60%),
        var(--bg);
    }

    .blob {
      position: absolute;
      width: 70vmax;
      height: 70vmax;
      border-radius: 50%;
      opacity: 0.45;
      will-change: transform;
    }

    .blob--violet {
      top: -25vmax; left: -20vmax;
      background: radial-gradient(circle, var(--violet) 0%, transparent 65%);
      animation: drift-1 22s ease-in-out infinite alternate;
    }

    .blob--cyan {
      bottom: -30vmax; right: -25vmax;
      background: radial-gradient(circle, var(--cyan) 0%, transparent 65%);
      animation: drift-2 26s ease-in-out infinite alternate;
    }

    .blob--pink {
      top: 30%; left: 40%;
      width: 50vmax; height: 50vmax;
      opacity: 0.28;
      background: radial-gradient(circle, var(--pink) 0%, transparent 65%);
      animation: drift-3 30s ease-in-out infinite alternate;
    }

    @keyframes drift-1 {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(18vmax, 22vmax) scale(1.15); }
    }
    @keyframes drift-2 {
      0%   { transform: translate(0, 0) scale(1.1); }
      100% { transform: translate(-20vmax, -16vmax) scale(0.95); }
    }
    @keyframes drift-3 {
      0%   { transform: translate(-50%, -50%) scale(0.9); }
      100% { transform: translate(-80%, -20%) scale(1.2); }
    }

    /* =========================================================
       4. CONTENEUR PRINCIPAL (mobile-first)
       Pleine largeur sur téléphone, centré et limité sur ordinateur.
       ========================================================= */
    .container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      padding: 48px 16px 32px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    /* =========================================================
       5. PROFIL (photo, nom, bio)
       ========================================================= */
    .profile {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
    }

    /* Anneau dégradé autour de la photo */
    .avatar {
      position: relative;
      width: 112px;
      height: 112px;
      padding: 3px;
      border-radius: 50%;
      background: conic-gradient(from 180deg, var(--violet), var(--cyan), var(--pink), var(--violet));
      box-shadow: 0 0 40px rgba(124, 58, 237, 0.45);
      margin-bottom: 4px;
    }

    /* Initiales affichées si l'image ne se charge pas */
    .avatar__fallback {
      position: absolute;
      inset: 3px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #1c1530;
      font-family: var(--font-title);
      font-weight: 700;
      font-size: 2rem;
    }

    .avatar img {
      position: relative;               /* passe au-dessus des initiales */
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--bg);
    }

    .profile__name {
      font-family: var(--font-title);
      font-weight: 700;
      font-size: 1.5rem;
      line-height: 1.25;
      letter-spacing: -0.01em;
    }

    .profile__bio {
      color: var(--text-muted);
      font-size: 1rem;
      max-width: 34ch;
    }

    /* =========================================================
       6. SECTION DE LIENS (une section = une catégorie)
       ========================================================= */
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Titre de catégorie avec lignes de part et d'autre */
    .links__title {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 4px;
      font-size: 0.8125rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .links__title::before,
    .links__title::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--glass-border), transparent);
    }

    /* =========================================================
       7. BOUTONS "VERRE TREMPÉ" (glassmorphism)
       ========================================================= */
    .link {
      --accent: 124, 58, 237;            /* couleur de lueur (RGB), redéfinie par lien */

      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 64px;                  /* zone tactile confortable (> 44px) */
      padding: 12px 16px;
      border-radius: var(--radius);
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(140%);
      backdrop-filter: blur(var(--glass-blur)) saturate(140%);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.25),
                  inset 0 1px 0 rgba(255, 255, 255, 0.06);
      cursor: pointer;
      transition:
        transform var(--speed) var(--ease),
        border-color var(--speed) var(--ease),
        background-color var(--speed) var(--ease),
        box-shadow var(--speed) var(--ease);
    }

    /* Couleur de lueur propre à chaque réseau */
    .link--github   { --accent: 240, 246, 252; }
    .link--linkedin { --accent: 10, 102, 194; }
    .link--email    { --accent: 6, 182, 212; }

    /* Pastille de l'icône */
    .link__icon {
      flex-shrink: 0;
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(var(--accent), 0.14);
      border: 1px solid rgba(var(--accent), 0.28);
      font-size: 1.15rem;
      transition: transform var(--speed) var(--ease);
    }

    .link__text {
      flex: 1;
      min-width: 0;                      /* permet la troncature du texte */
      display: flex;
      flex-direction: column;
    }

    .link__label {
      font-weight: 600;
      font-size: 1rem;
      line-height: 1.3;
    }

    .link__hint {
      font-size: 0.8125rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .link__arrow {
      flex-shrink: 0;
      font-size: 0.875rem;
      color: var(--text-muted);
      transition: transform var(--speed) var(--ease), color var(--speed) var(--ease);
    }

    /* --- Survol : uniquement sur les appareils avec souris ---
       (évite l'effet "bloqué" après un tap sur mobile) */
    @media (hover: hover) {
      .link:hover {
        transform: translateY(-2px) scale(1.02);
        background-color: var(--glass-bg-hover);
        border-color: rgba(var(--accent), 0.6);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3),
                    0 0 24px rgba(var(--accent), 0.35),
                    inset 0 1px 0 rgba(255, 255, 255, 0.1);
      }
      .link:hover .link__icon  { transform: scale(1.08) rotate(-4deg); }
      .link:hover .link__arrow { transform: translateX(4px); color: var(--text); }
    }

    /* --- Appui (mobile) : petit effet d'enfoncement --- */
    .link:active {
      transform: scale(0.98);
      transition-duration: 120ms;
    }

    /* --- Navigation clavier : contour bien visible --- */
    .link:focus-visible {
      outline: 2px solid rgb(var(--accent));
      outline-offset: 3px;
      border-color: var(--glass-border-hover);
    }

    /* Navigateurs sans backdrop-filter : fond plus opaque pour rester lisible */
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .link { background: rgba(30, 27, 50, 0.85); }
    }

    /* =========================================================
       8. PIED DE PAGE
       ========================================================= */
    .footer {
      margin-top: auto;                  /* colle le footer en bas si peu de contenu */
      text-align: center;
      font-size: 0.8125rem;
      color: var(--text-muted);
    }

    /* =========================================================
       9. APPARITION AU CHARGEMENT (fade in en cascade)
       Chaque élément .reveal a un délai défini par --d (0, 1, 2…).
       On anime la propriété "translate" (et non "transform") pour que
       l'animation, une fois terminée, ne bloque pas l'effet de survol.
       ========================================================= */
    .reveal {
      opacity: 0;
      animation: fade-up 700ms var(--ease) forwards;
      animation-delay: calc(var(--d, 0) * 90ms + 100ms);
    }

    @keyframes fade-up {
      from { opacity: 0; translate: 0 16px; }
      to   { opacity: 1; translate: 0 0; }
    }

    /* =========================================================
       10. ÉCRANS PLUS GRANDS (tablette / ordinateur)
       ========================================================= */
    @media (min-width: 768px) {
      .container {
        justify-content: center;         /* centrage vertical sur grand écran */
        padding-top: 64px;
      }
      .avatar { width: 128px; height: 128px; }
      .profile__name { font-size: 1.75rem; }
      .footer { margin-top: 16px; }
    }

    /* =========================================================
       11. ACCESSIBILITÉ : réduction des animations
       Respecte le réglage "Réduire les animations" de l'utilisateur.
       ========================================================= */
    @media (prefers-reduced-motion: reduce) {
      .blob { animation: none; }
      .reveal { animation: none; opacity: 1; }
      .link, .link__icon, .link__arrow { transition: none; }
      .link:hover, .link:active { transform: none; }
    }
  </style>
</head>

<body>
  <!-- Fond animé décoratif (ignoré par les lecteurs d'écran) -->
  <div class="background" aria-hidden="true">
    <div class="blob blob--violet"></div>
    <div class="blob blob--cyan"></div>
    <div class="blob blob--pink"></div>
  </div>

  <main class="container">

    <!-- =====================================================
         PROFIL
         ===================================================== -->
    <header class="profile">
      <div class="avatar reveal" style="--d: 0">
        <span class="avatar__fallback" aria-hidden="true">CB</span>
        <!-- À REMPLACER : mettez l'URL de votre vraie photo (carrée de préférence) -->
        <img
          src="https://ui-avatars.com/api/?name=Claudio+Baka&size=256&background=7c3aed&color=ffffff&bold=true"
          alt="Photo de profil de Claudio Marcelly BAKA"
          width="112" height="112"
          onerror="this.remove()" />
      </div>

      <h1 class="profile__name reveal" style="--d: 1">Claudio Marcelly BAKA</h1>
      <p class="profile__bio reveal" style="--d: 2">Passionné de dropshipping</p>
    </header>

    <!-- =====================================================
         CATÉGORIE : MES RÉSEAUX
         Pour ajouter une catégorie, dupliquez tout ce bloc <nav>.
         ===================================================== -->
    <nav class="links" aria-labelledby="titre-reseaux">
      <h2 class="links__title reveal" id="titre-reseaux" style="--d: 3">Mes Réseaux</h2>

      <!-- GitHub -->
      <a class="link link--github reveal" style="--d: 4"
         href="https://github.com/marcellyclaudio2623"
         target="_blank" rel="noopener noreferrer">
        <span class="link__icon" aria-hidden="true"><i class="fa-brands fa-github"></i></span>
        <span class="link__text">
          <span class="link__label">GitHub</span>
          <span class="link__hint">Mes projets et mon code</span>
        </span>
        <i class="fa-solid fa-arrow-right link__arrow" aria-hidden="true"></i>
      </a>

      <!-- LinkedIn — À REMPLACER : votre identifiant après /in/ -->
      <a class="link link--linkedin reveal" style="--d: 5"
         href="https://www.linkedin.com/in/VOTRE-PROFIL"
         target="_blank" rel="noopener noreferrer">
        <span class="link__icon" aria-hidden="true"><i class="fa-brands fa-linkedin-in"></i></span>
        <span class="link__text">
          <span class="link__label">LinkedIn</span>
          <span class="link__hint">Mon parcours professionnel</span>
        </span>
        <i class="fa-solid fa-arrow-right link__arrow" aria-hidden="true"></i>
      </a>

      <!-- Email — À REMPLACER : votre adresse de contact -->
      <a class="link link--email reveal" style="--d: 6"
         href="mailto:contact@exemple.com">
        <span class="link__icon" aria-hidden="true"><i class="fa-solid fa-envelope"></i></span>
        <span class="link__text">
          <span class="link__label">Email</span>
          <span class="link__hint">Me contacter directement</span>
        </span>
        <i class="fa-solid fa-arrow-right link__arrow" aria-hidden="true"></i>
      </a>
    </nav>

    <!-- =====================================================
         PIED DE PAGE
         ===================================================== -->
    <footer class="footer reveal" style="--d: 7">
      <p>&copy; 2026 Claudio Marcelly BAKA</p>
    </footer>

  </main>
</body>
</html>
